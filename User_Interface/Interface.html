<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        
        /* --- TAB NAVIGATION STYLES --- */
        .nav-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ccc;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #007bff;
            border-bottom: 2px solid #007bff;
        }
        .tab-btn:hover:not(.active) {
            color: #007bff;
            background-color: #f8f9fa;
        }
        .tab-content {
            display: none; /* Hides sections by default */
        }
        .tab-content.active {
            display: block; /* Shows the active section */
        }

        /* --- FORM STYLES --- */
        h2 {
            margin-top: 0;
            color: #333;
            padding-bottom: 10px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.action-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button.action-btn:hover {
            background-color: #0056b3;
        }
        button.action-btn.green {
            background-color: #28a745;
        }
        button.action-btn.green:hover {
            background-color: #218838;
        }
        .file-upload-container {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 2px dashed #ccc;
            text-align: center;
        }

        /* --- RESULT STYLES --- */
        #csvResultContainer {
            margin-top: 20px;
            overflow-x: auto;
            max-width: 100%;
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
            background-color: #fff;
        }
        .result-table th, .result-table td {
            border: 1px solid #dee2e6;
            padding: 8px 10px;
            text-align: left;
            white-space: nowrap;
        }
        .result-table th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: bold;
        }
        .badge-fraud {
            background-color: #dc3545;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-safe {
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="card">
    
    <!-- TAB BUTTONS -->
    <div class="nav-tabs">
        <button id="btn-single" class="tab-btn active" onclick="switchTab('single')">Single Transaction</button>
        <button id="btn-csv" class="tab-btn" onclick="switchTab('csv')">Batch CSV Upload</button>
    </div>

    <!-- SECTION 1: SINGLE TRANSACTION -->
    <div id="section-single" class="tab-content active">
        <h2>Manual Transaction Analysis</h2>
        <form id="transactionForm">
            <div class="form-group">
                <label for="amount">Transaction Amount ($)</label>
                <input type="number" id="amount" step="0.01" placeholder="e.g. 150.50" required>
            </div>
            <div class="form-group">
                <label for="transaction_hour">Time of Day (0-23 Hour)</label>
                <input type="number" id="transaction_hour" min="0" max="23" placeholder="e.g. 14" required>
            </div>
            <div class="form-group">
                <label for="merchant_category">Merchant Category</label>
                <select id="merchant_category" required>
                    <option value="Grocery">Grocery</option>
                    <option value="Food">Food/Dining</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Travel">Travel</option>
                    <option value="Other">Other / Unknown</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cardholder_age">Cardholder Age</label>
                <input type="number" id="cardholder_age" placeholder="e.g. 35" required>
            </div>
            <div class="form-group">
                <label for="foreign_transaction">Foreign Transaction?</label>
                <select id="foreign_transaction">
                    <option value="0">No (Local)</option>
                    <option value="1">Yes (Foreign)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location_mismatch">Billing & IP Location Mismatch?</label>
                <select id="location_mismatch">
                    <option value="0">No (Locations Match)</option>
                    <option value="1">Yes (Mismatch Detected)</option>
                </select>
            </div>
            <button type="submit" id="manualBtn" class="action-btn">Predict Fraud Status</button>
        </form>
        <div id="resultBox" style="display: none; margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; font-size: 16px;"></div>
    </div>

    <!-- SECTION 2: CSV UPLOAD -->
    <div id="section-csv" class="tab-content">
        <h2>Batch CSV Analysis</h2>
        <form id="csvForm">
            <div class="file-upload-container">
                <label for="csv_file" style="font-weight: bold; color: #555; display: block; margin-bottom: 10px;">Select a CSV file for Batch Analysis</label>
                <input type="file" id="csv_file" accept=".csv" required>
                <button type="submit" id="csvBtn" class="action-btn green">Upload & Analyze CSV</button>
            </div>
        </form>
        <div id="csvResultContainer" style="display: none;"></div>
    </div>

</div>

<script>
    // --- TAB SWITCHING LOGIC ---
    function switchTab(tabName) {
        // Hide both sections
        document.getElementById('section-single').classList.remove('active');
        document.getElementById('section-csv').classList.remove('active');
        
        // Deactivate both buttons
        document.getElementById('btn-single').classList.remove('active');
        document.getElementById('btn-csv').classList.remove('active');
        
        // Show the selected section and activate its button
        document.getElementById('section-' + tabName).classList.add('active');
        document.getElementById('btn-' + tabName).classList.add('active');
    }

    // --- MANUAL SUBMISSION LOGIC ---
    function showResult(message, isError = false) {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = "block";
        resultBox.innerText = message;
        
        if (isError) {
            resultBox.style.backgroundColor = "#f8d7da"; 
            resultBox.style.color = "#721c24"; 
            resultBox.style.border = "1px solid #f5c6cb";
        } else {
            resultBox.style.backgroundColor = "#d4edda"; 
            resultBox.style.color = "#155724";          
            resultBox.style.border = "1px solid #c3e6cb";
        }
    }

    document.getElementById('transactionForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const payload = {
            "amount": parseFloat(document.getElementById('amount').value),
            "transaction_hour": parseInt(document.getElementById('transaction_hour').value),
            "device_trust_score": 80,
            "velocity_last_24h": 1,
            "cardholder_age": parseInt(document.getElementById('cardholder_age').value),
            "merchant_category": document.getElementById('merchant_category').value,
            "foreign_transaction": parseInt(document.getElementById('foreign_transaction').value),
            "location_mismatch": parseInt(document.getElementById('location_mismatch').value)
        };

        const btn = document.getElementById('manualBtn');
        btn.innerText = "Running AI Model...";
        document.getElementById('resultBox').style.display = "none";

        fetch('http://127.0.0.1:5000/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(async response => {
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.message || "Backend pipeline failed."); 
            }
            return data;
        })
        .then(data => {
            if (data.is_fraud === 1) {
                showResult("🚨 ALERT: " + data.message, true);
            } else {
                showResult("✅ SAFE: " + data.message, false);
            }
            btn.innerText = "Predict Fraud Status";
        })
        .catch(error => {
            console.error("Error:", error);
            showResult(`Error connecting to API: ${error.message}`, true);
            btn.innerText = "Predict Fraud Status";
        });
    });

    // --- CSV SUBMISSION LOGIC ---
    document.getElementById('csvForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('csv_file');
        const btn = document.getElementById('csvBtn');
        const csvContainer = document.getElementById('csvResultContainer');

        if (!fileInput.files[0]) {
            alert("Please select a CSV file first.");
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        btn.innerText = "Processing...";
        csvContainer.innerHTML = "";
        csvContainer.style.display = "none";

        fetch('http://127.0.0.1:5000/upload-csv', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            btn.innerText = "Upload & Analyze CSV";

            if (data.status === "error" || data.error) {
                csvContainer.style.display = "block";
                csvContainer.innerHTML = `<p style="color: red; font-weight: bold;">Error: ${data.message || data.error}</p>`;
                return;
            }

            if (!data.results || data.results.length === 0) {
                csvContainer.style.display = "block";
                csvContainer.innerHTML = "<p>No prediction results returned.</p>";
                return;
            }

            let tableHTML = `<table class="result-table"><thead><tr>`;
            
            let columns = Object.keys(data.results[0]);
            
            if (columns.includes('is_fraud')) {
                columns = columns.filter(col => col !== 'is_fraud');
                columns.unshift('is_fraud');
            }

            columns.forEach(col => {
                tableHTML += `<th>${col}</th>`;
            });
            tableHTML += `</tr></thead><tbody>`;

            data.results.forEach(row => {
                tableHTML += `<tr>`;
                columns.forEach(col => {
                    if (col === 'is_fraud') {
                        let badgeClass = row[col] === 1 ? 'badge-fraud' : 'badge-safe';
                        let badgeText = row[col] === 1 ? '1 (Fraud)' : '0 (Safe)';
                        tableHTML += `<td><span class="${badgeClass}">${badgeText}</span></td>`;
                    } else {
                        tableHTML += `<td>${row[col] !== undefined ? row[col] : ''}</td>`;
                    }
                });
                tableHTML += `</tr>`;
            });

            tableHTML += `</tbody></table>`;
        
            csvContainer.innerHTML = tableHTML;
            csvContainer.style.display = "block";
        })
        .catch(error => {
            console.error("Error:", error);
            csvContainer.style.display = "block";
            csvContainer.innerHTML = `<p style="color: red; font-weight: bold;">Error uploading CSV: ${error.message}</p>`;
            btn.innerText = "Upload & Analyze CSV";
        });
    });
</script>
</body>
</html>
