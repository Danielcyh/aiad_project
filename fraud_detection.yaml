apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocessor-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preprocessor-service
  template:
    metadata:
      labels:
        app: preprocessor-service
    spec:
      containers:
      - name: preprocessor
        image: aiad_project-preprocessor-service:latest
        imagePullPolicy: Never 
        ports:
        - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: preprocessor-service
spec:
  selector:
    app: preprocessor-service
  ports:
  - port: 5001
    targetPort: 5001
---
